[project]
name = "codejudge-ai"
version = "0.1.0"
description = "AI layer for CodeJudge: document RAG + ADK agent(s) over codejudge-mcp."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",             # Gemini client: embeddings + generation
    "langchain-core>=0.3",             # InMemoryVectorStore (in-memory, no service)
    "langchain-text-splitters>=0.3",   # battle-tested recursive chunker
    "numpy>=1.26",                     # required by InMemoryVectorStore's cosine similarity
    "pypdf>=4.0",                      # PDF text extraction
    "python-docx>=1.1",                # Word (.docx) text extraction
    "python-dotenv>=1.0",              # load .env for local runs
]

[project.optional-dependencies]
# The agent runtime. Kept optional so the RAG pipeline (ingest/search) can be
# installed and tested without pulling the full agent stack.
agent = [
    "google-adk>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codejudge_ai*"]
