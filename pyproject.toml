[project]
name = "codejudge-ai"
version = "0.1.0"
description = "AI layer for CodeJudge: document RAG + ADK agent + a Python MCP server."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",             # Gemini client: embeddings + generation
    "langchain-core>=0.3",             # InMemoryVectorStore (in-memory, no service)
    "langchain-text-splitters>=0.3",   # battle-tested recursive chunker
    "numpy>=1.26",                     # required by InMemoryVectorStore's cosine similarity
    "pypdf>=4.0",                      # PDF text extraction
    "python-docx>=1.1",                # Word (.docx) text extraction
    "python-dotenv>=1.0",              # load .env for local runs
    "mcp>=1.10,<2",                    # MCP server (FastMCP); <2 for ADK client compatibility
    "httpx>=0.27",                     # async HTTP client for CodeJudge
    "pydantic>=2.0",                   # nested MCP tool argument schemas (TestCase, ProblemLimits)
]

[project.optional-dependencies]
# The agent runtime. Kept optional so the RAG pipeline (ingest/search) and the
# MCP server can be installed and tested without pulling the full agent stack.
# (The ADK MCP client also needs `mcp`, which is a core dependency above.)
agent = [
    "google-adk>=1.0.0",
]
# For persistent (non-in-memory) ADK session storage during development. Set
# CODEJUDGE_AI_SESSION_DB_URL in .env and use `python -m codejudge_ai.scripts.web`
# (or server.py) -- sessions then survive restarts, which the in-memory default
# does not. See docs/RUNNING.md.
persist = [
    "sqlalchemy>=2,<3",
    "asyncpg>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codejudge_ai*", "codejudge_mcp*"]
